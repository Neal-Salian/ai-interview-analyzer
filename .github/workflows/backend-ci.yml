name: Backend CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: interviewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/

      - name: Type check with mypy
        working-directory: backend
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # non-blocking until you add full type hints

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/interviewer_test
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZOOM_ACCOUNT_ID: fake
          ZOOM_CLIENT_ID: fake
          ZOOM_CLIENT_SECRET: fake
          ZOOM_WEBHOOK_SECRET: fake
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/interviewer_test
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZOOM_ACCOUNT_ID: fake
          ZOOM_CLIENT_ID: fake
          ZOOM_CLIENT_SECRET: fake
          ZOOM_WEBHOOK_SECRET: fake
        run: pytest tests/ -v --ignore=tests/test_stream.py --ignore=tests/test_websocket.py
        # Ignoring stream/websocket tests — they require live infrastructure