name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR comes from dev branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs to main must come from the dev branch only."
            exit 1
          fi

  check-commit-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message format
        run: |
          git log origin/main..HEAD --format="%s" | while read msg; do
            if ! echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|ci)\(.+\): .+"; then
              echo "Bad commit message: '$msg'"
              echo "Expected format: type(scope): message"
              exit 1
            fi
          done